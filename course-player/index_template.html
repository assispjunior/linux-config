<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{COURSE_NAME}}</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d0d0f;
    --bg2: #17171c;
    --bg3: #1f1f27;
    --bg4: #27272f;
    --accent: #7c5cfc;
    --accent2: #9b7fff;
    --accent-dim: #7c5cfc22;
    --text: #e8e8f0;
    --text2: #9090a8;
    --text3: #606078;
    --success: #22c55e;
    --success-dim: #22c55e20;
    --border: #2a2a36;
    --sidebar-w: 320px;
    --header-h: 58px;
  }

  *, *::before, *::after { scrollbar-width: thin; scrollbar-color: var(--bg4) transparent; }
  html, body { height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); font-size: 14px; }

  #app { display: flex; flex-direction: column; height: 100vh; }

  /* HEADER */
  #header {
    height: var(--header-h);
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 20px;
    gap: 16px;
    flex-shrink: 0;
  }
  #header h1 { font-size: 15px; font-weight: 700; white-space: nowrap; }
  .hprog { flex: 1; display: flex; align-items: center; gap: 10px; min-width: 0; }
  .hprog-bg { flex: 1; height: 6px; background: var(--bg4); border-radius: 99px; overflow: hidden; }
  .hprog-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 99px; transition: width .4s; width: 0%; }
  .hprog-pct { font-size: 12px; color: var(--text2); min-width: 36px; text-align: right; }

  /* BODY */
  #body { display: flex; flex: 1; overflow: hidden; }

  /* SIDEBAR */
  #sidebar { width: var(--sidebar-w); min-width: var(--sidebar-w); background: var(--bg2); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
  #sidebar-inner { overflow-y: auto; flex: 1; padding-bottom: 20px; }

  .section-block { border-bottom: 1px solid var(--border); }
  .section-hdr {
    display: flex; align-items: center; padding: 11px 14px; cursor: pointer;
    user-select: none; gap: 9px; transition: background .15s;
  }
  .section-hdr:hover { background: var(--bg3); }
  .chev { width: 15px; height: 15px; color: var(--text3); flex-shrink: 0; transition: transform .2s; }
  .section-block.open .chev { transform: rotate(90deg); }
  .sec-info { flex: 1; min-width: 0; }
  .sec-name { font-size: 12.5px; font-weight: 600; color: var(--text); line-height: 1.3; }
  .sec-meta { font-size: 11px; color: var(--text3); margin-top: 2px; }
  .sec-bar { width: 32px; flex-shrink: 0; }
  .sec-bar-bg { height: 4px; background: var(--bg4); border-radius: 99px; overflow: hidden; }
  .sec-bar-fill { height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s; }

  .sec-lessons { display: none; }
  .section-block.open .sec-lessons { display: block; }

  .lesson-item {
    display: flex; align-items: center; padding: 8px 14px 8px 38px;
    cursor: pointer; gap: 9px; transition: background .15s; border-left: 2px solid transparent;
  }
  .lesson-item:hover { background: var(--bg3); }
  .lesson-item.active { background: var(--accent-dim); border-left-color: var(--accent); }
  .lcheck {
    width: 17px; height: 17px; border-radius: 50%; border: 2px solid var(--border);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all .2s;
  }
  .lesson-item.watched .lcheck { background: var(--success); border-color: var(--success); }
  .lcheck svg { display: none; }
  .lesson-item.watched .lcheck svg { display: block; }
  .lname { font-size: 12px; color: var(--text2); line-height: 1.4; flex: 1; min-width: 0; }
  .lesson-item.active .lname { color: var(--text); }

  /* MAIN */
  #main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

  /* PLAY CARD */
  #play-card {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    background: var(--bg);
    padding: 40px;
    min-height: 0;
  }

  #play-card.empty { gap: 14px; }

  .play-icon-wrap {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: var(--bg3);
    border: 2px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all .2s;
  }

  #play-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    cursor: pointer;
    background: none;
    border: none;
    color: var(--text);
    transition: transform .15s;
  }
  #play-btn:hover { transform: scale(1.04); }
  #play-btn:hover .play-icon-wrap {
    background: var(--accent);
    border-color: var(--accent);
    box-shadow: 0 0 40px #7c5cfc55;
  }
  #play-btn:disabled { opacity: .5; cursor: default; transform: none; }
  #play-btn:disabled:hover .play-icon-wrap { background: var(--bg3); border-color: var(--border); box-shadow: none; }

  .play-label { font-size: 13px; color: var(--text2); font-weight: 500; }

  .play-hint { font-size: 11.5px; color: var(--text3); }

  /* INFO PANEL */
  #info-panel {
    background: var(--bg2);
    border-top: 1px solid var(--border);
    padding: 14px 22px;
    display: none;
    align-items: center;
    gap: 16px;
    flex-shrink: 0;
  }
  #lesson-title { font-size: 15px; font-weight: 700; color: var(--text); }
  #section-label { font-size: 11px; color: var(--text3); margin-top: 3px; }
  #title-wrap { flex: 1; min-width: 0; }

  .btn-watch {
    display: flex; align-items: center; gap: 7px;
    padding: 8px 16px; border-radius: 8px; border: none;
    cursor: pointer; font-size: 13px; font-weight: 600;
    transition: all .2s; flex-shrink: 0;
    background: var(--bg4); color: var(--text2);
  }
  .btn-watch:hover { background: var(--bg3); }
  .btn-watch.watched { background: var(--success-dim); color: var(--success); }

  /* DESC */
  #desc-panel { background: var(--bg2); border-top: 1px solid var(--border); display: none; max-height: 160px; overflow-y: auto; }
  #desc-content { padding: 10px 22px; font-size: 13px; color: var(--text2); line-height: 1.7; }
  #desc-content a { color: var(--accent2); }

  /* MATERIALS */
  #mat-wrap { display: none; padding: 0 22px 12px; background: var(--bg2); }
  #mat-wrap.show { display: block; }
  .mat-title { font-size: 11px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 8px; }
  .mat-item {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 10px; background: var(--bg3); border-radius: 6px;
    font-size: 12px; color: var(--text2); text-decoration: none;
    margin: 0 6px 6px 0; border: 1px solid var(--border); transition: all .15s;
  }
  .mat-item:hover { border-color: var(--accent); color: var(--accent2); }

  /* EMPTY STATE */
  #empty-state {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; color: var(--text3);
  }
  #empty-state svg { opacity: .15; }
  #empty-state h2 { font-size: 18px; color: var(--text2); }
  #empty-state p { font-size: 13px; }

  /* TOAST */
  #toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--bg3); border: 1px solid var(--border);
    color: var(--text); padding: 10px 20px; border-radius: 10px;
    font-size: 13px; opacity: 0; transition: opacity .3s; pointer-events: none;
    white-space: nowrap; z-index: 999;
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<div id="app">
  <header id="header">
    <h1>{{COURSE_NAME}}</h1>
    <div class="hprog">
      <div class="hprog-bg"><div class="hprog-fill" id="gbar"></div></div>
      <span class="hprog-pct" id="gpct">0%</span>
    </div>
  </header>

  <div id="body">
    <aside id="sidebar"><div id="sidebar-inner"></div></aside>

    <main id="main">
      <!-- Empty state -->
      <div id="empty-state">
        <svg width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><circle cx="12" cy="12" r="10"/><polygon points="10,8 16,12 10,16"/></svg>
        <h2>{{COURSE_NAME}}</h2>
        <p>Selecione uma aula para começar</p>
      </div>

      <!-- Play card -->
      <div id="play-card" style="display:none">
        <button id="play-btn" onclick="playVideo()">
          <div class="play-icon-wrap">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>
          </div>
          <span class="play-label">Abrir no Haruna</span>
        </button>
        <span class="play-hint" id="play-hint"></span>
      </div>

      <!-- Info -->
      <div id="info-panel">
        <div id="title-wrap">
          <div id="lesson-title"></div>
          <div id="section-label"></div>
        </div>
        <button class="btn-watch" id="watch-btn" onclick="toggleWatch()">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20,6 9,17 4,12"/></svg>
          <span id="watch-label">Marcar como visto</span>
        </button>
      </div>

      <div id="desc-panel"><div id="desc-content"></div></div>
      <div id="mat-wrap"><div class="mat-title">Materiais</div><div id="mat-list"></div></div>
    </main>
  </div>
</div>
<div id="toast"></div>

<script>
let course = [], progress = {}, current = null;

const FILE_ICONS = { pdf:'📄', png:'🖼️', jpg:'🖼️', jpeg:'🖼️', xlsx:'📊', xls:'📊', pptx:'📑', zip:'🗜️' };

async function init() {
  [course, progress] = await Promise.all([
    fetch('/api/course').then(r => r.json()),
    fetch('/api/progress').then(r => r.json())
  ]);
  renderSidebar();
  updateGlobalProgress();
}

function renderSidebar() {
  const el = document.getElementById('sidebar-inner');
  el.innerHTML = course.map((sec, si) => {
    const watched = sec.lessons.filter(l => progress[l.id]).length;
    const total = sec.lessons.length;
    const pct = total ? Math.round(watched / total * 100) : 0;
    return `
      <div class="section-block" data-si="${si}">
        <div class="section-hdr" onclick="toggleSec(${si})">
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9,18 15,12 9,6"/></svg>
          <div class="sec-info">
            <div class="sec-name">${sec.name}</div>
            <div class="sec-meta">${watched}/${total} aulas</div>
          </div>
          <div class="sec-bar"><div class="sec-bar-bg"><div class="sec-bar-fill" style="width:${pct}%"></div></div></div>
        </div>
        <div class="sec-lessons">
          ${sec.lessons.map((l, li) => `
            <div class="lesson-item ${progress[l.id] ? 'watched' : ''}" id="ll-${si}-${li}" onclick="selectLesson(${si},${li})">
              <div class="lcheck">
                <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3.5"><polyline points="20,6 9,17 4,12"/></svg>
              </div>
              <span class="lname">${l.name}</span>
            </div>
          `).join('')}
        </div>
      </div>`;
  }).join('');
}

function toggleSec(si) {
  document.querySelector(`.section-block[data-si="${si}"]`).classList.toggle('open');
}

async function selectLesson(si, li) {
  const sec = course[si], lesson = sec.lessons[li];
  current = { si, li, lesson, sec };

  document.querySelectorAll('.lesson-item').forEach(e => e.classList.remove('active'));
  const el = document.getElementById(`ll-${si}-${li}`);
  if (el) { el.classList.add('active'); el.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }

  const block = document.querySelector(`.section-block[data-si="${si}"]`);
  if (block && !block.classList.contains('open')) block.classList.add('open');

  // Show/hide panels
  document.getElementById('empty-state').style.display = 'none';
  document.getElementById('play-card').style.display = lesson.video ? 'flex' : 'none';
  document.getElementById('info-panel').style.display = 'flex';

  // Play card
  if (lesson.video) {
    const hint = lesson.video.split('/').pop();
    document.getElementById('play-hint').textContent = hint;
    document.getElementById('play-btn').disabled = false;
  }

  // Info
  document.getElementById('lesson-title').textContent = lesson.name;
  document.getElementById('section-label').textContent = sec.name;
  updateWatchBtn();

  // Description
  const descPanel = document.getElementById('desc-panel');
  if (lesson.description) {
    const html = await fetch('/file/' + encodeURIComponent(lesson.description).replace(/%2F/g,'/')).then(r => r.text());
    document.getElementById('desc-content').innerHTML = html;
    descPanel.style.display = 'block';
  } else {
    descPanel.style.display = 'none';
  }

  // Materials
  const matWrap = document.getElementById('mat-wrap');
  if (lesson.materials?.length) {
    document.getElementById('mat-list').innerHTML = lesson.materials.map(m => {
      const ext = m.name.split('.').pop().toLowerCase();
      return `<a class="mat-item" href="/file/${encodeURIComponent(m.path).replace(/%2F/g,'/')}" target="_blank">${FILE_ICONS[ext]||'📎'} ${m.name}</a>`;
    }).join('');
    matWrap.classList.add('show');
  } else {
    matWrap.classList.remove('show');
  }
}

async function playVideo() {
  if (!current?.lesson?.video) return;
  const btn = document.getElementById('play-btn');
  btn.disabled = true;
  document.querySelector('#play-btn .play-label').textContent = 'Abrindo...';

  const res = await fetch('/api/play', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ video_path: current.lesson.video, lesson_id: current.lesson.id })
  });

  btn.disabled = false;
  document.querySelector('#play-btn .play-label').textContent = 'Abrir no Haruna';

  if (res.ok) {
    showToast('Reproduzindo no Haruna — será marcado como visto ao fechar');
    // Poll progress após 5s para atualizar se o player já fechou
    setTimeout(pollProgress, 5000);
  } else {
    showToast('Erro ao abrir o player');
  }
}

async function pollProgress() {
  const fresh = await fetch('/api/progress').then(r => r.json());
  if (current && fresh[current.lesson.id] && !progress[current.lesson.id]) {
    progress[current.lesson.id] = true;
    updateWatchBtn();
    updateSidebarLesson();
    updateGlobalProgress();
    showToast('Aula marcada como vista');
  }
  // Continua polling enquanto o player estiver aberto
  if (current && !progress[current.lesson.id]) {
    setTimeout(pollProgress, 3000);
  }
}

async function toggleWatch() {
  if (!current) return;
  const newVal = !progress[current.lesson.id];
  progress[current.lesson.id] = newVal;
  await fetch('/api/progress', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ lesson_id: current.lesson.id, watched: newVal })
  });
  updateWatchBtn();
  updateSidebarLesson();
  updateGlobalProgress();
}

function updateWatchBtn() {
  if (!current) return;
  const btn = document.getElementById('watch-btn');
  const label = document.getElementById('watch-label');
  const watched = !!progress[current.lesson.id];
  btn.classList.toggle('watched', watched);
  label.textContent = watched ? 'Visto' : 'Marcar como visto';
}

function updateSidebarLesson() {
  if (!current) return;
  const { si, li, lesson, sec } = current;
  const el = document.getElementById(`ll-${si}-${li}`);
  if (el) el.classList.toggle('watched', !!progress[lesson.id]);

  const block = document.querySelector(`.section-block[data-si="${si}"]`);
  if (block) {
    const total = sec.lessons.length;
    const watched = sec.lessons.filter(l => progress[l.id]).length;
    const pct = total ? Math.round(watched / total * 100) : 0;
    block.querySelector('.sec-meta').textContent = `${watched}/${total} aulas`;
    block.querySelector('.sec-bar-fill').style.width = pct + '%';
  }
}

function updateGlobalProgress() {
  let total = 0, watched = 0;
  course.forEach(s => { total += s.lessons.length; watched += s.lessons.filter(l => progress[l.id]).length; });
  const pct = total ? Math.round(watched / total * 100) : 0;
  document.getElementById('gbar').style.width = pct + '%';
  document.getElementById('gpct').textContent = pct + '%';
}

let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3500);
}

init();
</script>
</body>
</html>
